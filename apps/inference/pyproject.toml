[project]
name = "plasmaxai-inference-service"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "torch",
  "torchvision",
  "timm",
  "numpy",
  "opencv-python-headless",
  "pillow",
  "joblib",
  "scikit-learn",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel.scripts]
build = "python build.py"
